appId: com.dshdesktophub.app
productName: DSH Desktop Hub
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - package.json
  - resources/**/*
  - '!resources/node/*.zip'
  - '!**/*.map'
# asar: false —— 去掉 app.asar.unpacked 层（-29 字符），NSIS 安装路径深度彻底低于 260 上限
asar: false
publish:
  provider: github
  owner: FlashingChen
  repo: dsh-desktop-hub
mac:
  category: public.app-category.developer-tools
  icon: build/icon.png
  # 与 latest-mac.yml 中的安全文件名保持一致；默认 ProductName 含空格会导致更新 404。
  artifactName: DSH-Desktop-Hub-${version}-${arch}-mac.${ext}
  target:
    - target: dmg
      arch: [arm64]
    # DMG 用于首次下载安装；正式签名后 zip 才作为 electron-updater 的 macOS 更新载荷。
    - target: zip
      arch: [arm64]
  # 签名策略：默认 identity 显式为 null —— 本地无 Developer ID 证书时干净跳过签名
  # （不会被钥匙串里的 Apple Development 证书误签导致出包失败）。
  # Release CI 签名步骤用 -c.mac.identity="" 覆盖（空字符串≠null，会启用自动发现，
  # 在 CSC_LINK 导入的临时钥匙串里找到 Developer ID 证书后签名公证）。
  # 注意 v26 语义：identity 为 null 时连 CSC_LINK 也被无视，故不能靠环境变量单独开启。
  identity: null
  hardenedRuntime: true
  # arm64 Electron 渲染进程需要 JIT 权限，否则签名后启动即崩溃；
  # electron-builder 默认读取 build/entitlements.mac.plist
  entitlements: build/entitlements.mac.plist
  notarize: true
dmg:
  artifactName: DSH-Desktop-Hub-${version}-${arch}.${ext}
# Windows：NSIS assisted 向导，可选择安装目录；per-user 免管理员
# 注意：CLI 带平台参数（--win）时 arch 以 CLI 为准（默认本机 arch），yml 的 arch 仅作声明/无 CLI 参数时生效；
# CI 显式传 --x64 / --arm64 保证与 runner 架构解耦。
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
  artifactName: DSH-Desktop-Hub-${version}-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  # 自定义「运行中应用查杀」：修默认实现盲区（目录内 node.exe 孤儿、域账户 USERNAME 过滤失配）
  include: installer.nsh
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DSH Desktop Hub
  runAfterFinish: true
npmRebuild: false
