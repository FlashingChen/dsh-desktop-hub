appId: com.dshdesktophub.app
productName: DSH Desktop Hub
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - package.json
  - resources/**/*
  - '!resources/node/*.zip'
  - '!**/*.map'
# asar: false —— 去掉 app.asar.unpacked 层（-29 字符），NSIS 安装路径深度彻底低于 260 上限
asar: false
mac:
  category: public.app-category.developer-tools
  icon: build/icon.png
  target:
    - target: dmg
      arch: [arm64]
  identity: null
dmg:
  artifactName: DSH-Desktop-Hub-${version}-${arch}.${ext}
# Windows：NSIS assisted 向导，可选择安装目录；per-user 免管理员
# 注意：CLI 带平台参数（--win）时 arch 以 CLI 为准（默认本机 arch），yml 的 arch 仅作声明/无 CLI 参数时生效；
# CI 显式传 --x64 / --arm64 保证与 runner 架构解耦。
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
  artifactName: DSH-Desktop-Hub-${version}-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  # 自定义「运行中应用查杀」：修默认实现盲区（目录内 node.exe 孤儿、域账户 USERNAME 过滤失配）
  include: installer.nsh
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DSH Desktop Hub
  runAfterFinish: true
npmRebuild: false
