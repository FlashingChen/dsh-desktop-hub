appId: com.dshdesktophub.app
productName: DSH Desktop Hub
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - package.json
  - resources/**/*
  - '!resources/node/*.zip'
  - '!**/*.map'
asarUnpack:
  - resources/dsh-runtime/**/*
  - resources/node/**/*
mac:
  category: public.app-category.developer-tools
  icon: build/icon.png
  target:
    - target: dmg
      arch: [arm64]
  identity: null
dmg:
  artifactName: DSH-Desktop-Hub-${version}-${arch}.${ext}
# Windows：NSIS 安装包，oneClick 免向导（双击 → 进度 → 自动启动）；per-user 免管理员
# 注意：CLI 带平台参数（--win）时 arch 以 CLI 为准（默认本机 arch），yml 的 arch 仅作声明/无 CLI 参数时生效；
# CI 显式传 --x64 / --arm64 保证与 runner 架构解耦。
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
  artifactName: DSH-Desktop-Hub-${version}-${arch}.${ext}
nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DSH Desktop Hub
  runAfterFinish: true
npmRebuild: false
