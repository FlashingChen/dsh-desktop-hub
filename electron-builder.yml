appId: com.dshdesktophub.app
productName: DSH Desktop Hub
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - package.json
  - resources/**/*
asarUnpack:
  - resources/dsh-runtime/**/*
  - resources/node/**/*
mac:
  category: public.app-category.developer-tools
  icon: build/icon.png
  target:
    - target: dmg
      arch: [arm64]
  identity: null
dmg:
  artifactName: DSH-Desktop-Hub-${version}-${arch}.${ext}
npmRebuild: false
