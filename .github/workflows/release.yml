name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release (${{ github.ref_name }})
    runs-on: macos-15 # arm64 runner，匹配 electron-builder.yml 中的 mac.arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync version from git tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Releasing version: ${VERSION}"
          npm version "${VERSION}" --no-git-tag-version --no-commit-hooks --allow-same-version

      - name: Verify (typecheck + build + tests)
        run: npm run verify

      - name: Bundle runtime (Node + DSH)
        run: node scripts/bundle-runtime.mjs

      - name: Package DMG
        run: npx electron-builder --mac dmg
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            release/*.dmg
            release/*.dmg.blockmap
          generate_release_notes: true
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
