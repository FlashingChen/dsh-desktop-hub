name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release (${{ github.ref_name }})
    runs-on: macos-15 # arm64 runner，匹配 electron-builder.yml 中的 mac.arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync version from git tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Releasing version: ${VERSION}"
          npm version "${VERSION}" --no-git-tag-version --no-commit-hooks --allow-same-version

      - name: Verify (typecheck + build + tests)
        run: npm run verify

      - name: Bundle runtime (Node + DSH)
        run: node scripts/bundle-runtime.mjs

      - name: Package DMG
        # 显式 arch 与 runner 架构解耦（CLI 平台参数会覆盖 yml 的 arch 配置）
        run: npx electron-builder --mac dmg --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            release/*.dmg
            release/*.dmg.blockmap
          generate_release_notes: true
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

  release-windows:
    name: Build Windows installer (${{ github.ref_name }})
    runs-on: windows-latest
    # 等 mac job 先建好 release 再上传资产，避免 softprops 并发 create release 冲突
    needs: release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync version from git tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Releasing version: ${VERSION}"
          npm version "${VERSION}" --no-git-tag-version --no-commit-hooks --allow-same-version

      - name: Verify (typecheck + build + tests)
        run: npm run verify

      - name: Bundle runtime (Node + DSH, win32)
        run: node scripts/bundle-runtime.mjs

      - name: Package NSIS installer
        # 显式 --x64：CLI 平台参数下 arch 以 CLI 为准，不依赖 runner 架构
        run: npx electron-builder --win nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Publish GitHub Release (Windows)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            release/*.exe
            release/*.exe.blockmap
          generate_release_notes: false
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
