name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # 1) 秒级：先建 draft Release（含自动 release notes），Win/Mac 构建完一起转正
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --generate-notes --repo "$GITHUB_REPOSITORY"

  # 2a) macOS（DMG 只能在 macOS runner 构建）——与 Windows 并行
  build-mac:
    name: Build macOS installer (${{ github.ref_name }})
    runs-on: macos-15 # arm64 runner，匹配 electron-builder.yml 中的 mac.arch: arm64
    needs: create-release
    # 步骤级 if 无法直接读 secrets，先映射到 job env 用于签名/回退分支判断
    env:
      MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync version from git tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Releasing version: ${VERSION}"
          npm version "${VERSION}" --no-git-tag-version --no-commit-hooks --allow-same-version

      - name: Verify (typecheck + build + tests)
        run: npm run verify

      - name: Bundle runtime (Node + DSH, darwin)
        run: node scripts/bundle-runtime.mjs

      - name: Package macOS installers (signed + notarized)
        # DMG 给首次安装；签名后 zip + blockmap 供 electron-updater 下载更新。
        # 显式 arch 与 runner 架构解耦（CLI 平台参数会覆盖 yml 的 arch 配置）。
        # 签名与公证：仓库 Secrets 配齐 MAC_CERT_P12 / MAC_CERT_PASSWORD / APPLE_ID /
        # APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID 后走本步骤；未配置时走下方回退步骤。
        # 注意：此处不可设 CSC_IDENTITY_AUTO_DISCOVERY=false——v26 下会连 CSC_LINK
        # 导入的临时钥匙串也跳过查找，导致配了证书仍不签名；也不可用 CSC_NAME
        # 指定证书名（v26 禁止带 Developer ID Application 前缀，自动发现即可）。
        # -c.mac.identity="" 覆盖 yml 的 null（空串走自动发现，null 则无条件跳过签名）。
        if: env.MAC_CERT_P12 != ''
        run: npx electron-builder --mac dmg zip --arm64 -c.mac.identity="" --publish never
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Package macOS installers (unsigned fallback)
        # 未配置签名 secrets 时的回退：与历史行为一致，显式关闭签名探测。
        if: env.MAC_CERT_P12 == ''
        run: npx electron-builder --mac dmg zip --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload artifacts to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" release/*.dmg release/*.dmg.blockmap release/*.zip release/*.zip.blockmap release/latest-mac.yml \
            --clobber --repo "$GITHUB_REPOSITORY"

  # 2b) Windows（NSIS 在 Windows runner 上构建）——与 macOS 并行
  build-windows:
    name: Build Windows installer (${{ github.ref_name }})
    runs-on: windows-latest
    needs: create-release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync version from git tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Releasing version: ${VERSION}"
          npm version "${VERSION}" --no-git-tag-version --no-commit-hooks --allow-same-version

      - name: Verify (typecheck + build + tests)
        run: npm run verify

      - name: Bundle runtime (Node + DSH, win32)
        run: node scripts/bundle-runtime.mjs

      - name: Prepare smoke profile (empty web profile for CI)
        shell: bash
        run: |
          mkdir -p "$USERPROFILE/.dsh/profiles/web"
          # bundles 必须非空：listProfiles 会过滤空 bundles 的 profile，否则 smoke 的 plugin 状态无法加载
          printf '{"dependencies":{},"dsh":{"profile":{"bundles":["web"]}}}' > "$USERPROFILE/.dsh/profiles/web/package.json"

      - name: Smoke test (Electron renderer + tabs, no harness)
        # 主帧加载失败（如非法 file:// URL）会让 smoke 非零退出——Windows 渲染回归的守门员
        timeout-minutes: 5
        run: npx electron . --smoke

      - name: Upload main log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-main-log
          path: ${{ env.USERPROFILE }}/.dsh-desktop-hub/logs/*.log
          if-no-files-found: ignore

      - name: Package NSIS installer
        # 显式 --x64：CLI 平台参数下 arch 以 CLI 为准，不依赖 runner 架构
        run: npx electron-builder --win nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload artifacts to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" release/*.exe release/*.exe.blockmap release/latest.yml \
            --clobber --repo "$GITHUB_REPOSITORY"

  # 3) 收尾：双平台都成功才把 draft 转正（实现「完成一个版本后自动发布」）
  publish:
    name: Publish release (${{ github.ref_name }})
    runs-on: ubuntu-latest
    needs: [build-mac, build-windows]
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "$GITHUB_REF_NAME" --draft=false --repo "$GITHUB_REPOSITORY"