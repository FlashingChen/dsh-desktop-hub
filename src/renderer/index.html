<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>DSH Desktop</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f1115;
        --panel: #171a21;
        --line: #2a2f3a;
        --text: #e6e9ef;
        --muted: #8b93a3;
        --accent: #4f8cff;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
        background: var(--bg);
        color: var(--text);
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 8px 12px;
        background: var(--panel);
        border-bottom: 1px solid var(--line);
      }
      header .brand { font-weight: 600; margin-right: 16px; font-size: 14px; }
      .tab {
        padding: 6px 14px;
        border-radius: 6px;
        border: 1px solid transparent;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        font-size: 13px;
      }
      .tab:hover { color: var(--text); }
      .tab.active { color: var(--text); background: #232837; border-color: var(--line); }
      main { flex: 1; overflow: auto; }
      .panel { display: none; padding: 24px; height: 100%; }
      .panel.active { display: block; }
      .placeholder { color: var(--muted); font-size: 13px; line-height: 1.8; }
      footer {
        padding: 6px 12px;
        font-size: 11px;
        color: var(--muted);
        background: var(--panel);
        border-top: 1px solid var(--line);
        display: flex;
        gap: 16px;
      }
    </style>
  </head>
  <body>
    <header id="tabbar">
      <span class="brand">DSH Desktop</span>
      <button class="tab active" data-tab="harness">Harness</button>
      <button class="tab" data-tab="plugin">Plugin</button>
      <button class="tab" data-tab="mcp">MCP</button>
      <button class="tab" data-tab="skills">Skills</button>
    </header>
    <main>
      <section class="panel active" id="panel-harness">
        <div class="placeholder">Harness 面板：M1 将在此加载 DSH Web UI。</div>
      </section>
      <section class="panel" id="panel-plugin">
        <div class="placeholder">Plugin 系统：M2 将在此实现插件管理。</div>
      </section>
      <section class="panel" id="panel-mcp">
        <div class="placeholder">MCP 系统：M3 将在此实现 JSON→YAML 转换。</div>
      </section>
      <section class="panel" id="panel-skills">
        <div class="placeholder">Skills 系统：M4 将在此实现 skills 管理。</div>
      </section>
    </main>
    <footer>
      <span id="footer-versions"></span>
    </footer>
    <script src="renderer.js"></script>
  </body>
</html>
